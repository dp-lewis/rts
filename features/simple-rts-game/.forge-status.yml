  - "specs/simulation/spec.md"
  - "specs/gameplay/spec.md"
  - "specs/interface/spec.md"
contracts:
  openapi: not_applicable   # no HTTP surface; Express/MongoDB are v1 non-goals
  asyncapi: not_applicable  # no EDA patterns detected (research/codebase-analysis.md)
  note: "contracts/README.md records why, rather than emitting empty stubs that api-docs and sync-verify Layer 8 would validate against a fiction."

