      - "F-5 ABSORBED into T073 - tune toward a legibility ceiling of ~25-30 units per side. The ~60 figure arrived as a performance NFR and was never a design decision; 60 units on 220 cells is 27% map occupancy with no camera to zoom out of."
      - "F-6 ABSORBED into T039/T080 - a Base with no surviving Workers affords one at zero cost, removing a dead state where a player can neither act nor lose."
      - "F-7 ABSORBED as T081 - 30-minute greyscale spike before T051. The underglow ring is the entire WCAG 1.4.1 mitigation and the drawn sprite is materially smaller than its 64px canvas."
