problem:
  statement: "A casual player wanting an RTS fix in a spare 15 minutes has no maintained browser RTS that delivers a complete match arc."
  jtbd: "When I have 15 spare minutes and want something more strategic than a puzzle game, I want to jump straight into a complete RTS skirmish in a browser tab, so I can get the full build-up-and-win arc in one short sitting."
  segment: "Casual desktop browser players with RTS familiarity or nostalgia; short opportunistic sessions; no install, no account."
  severity: "4/10"
  validation: "Weak"
  go_decision: "go"
  go_basis: "Craft/capability goals (playable fun match + clean extensible codebase), not validated market pain. Severity deliberately not the gating factor."
  forces: { push: medium, pull: medium-high, inertia: high, anxiety: low-medium }
  risks:
    - "R1: Constitution mandates deterministic sim + replay regression (NON-NEGOTIABLE) but determinism was not a stated success outcome. Unbudgeted cost; must be resolved explicitly before Phase 5 Plan."
    - "R2: The real competitor is 'play nothing' at zero cost. Time-to-comprehension dominates; onboarding is make-or-break."
    - "R3: 'Simple' is undefined and RTS scope creeps. Needs a hard written v1 unit/resource/mechanic budget plus explicit non-goals."
    - "R4: 'Fun' is not derivable from a spec; needs a playtest-and-tune loop the plan must protect."
  hypotheses:
    H1: "Quick-session browser RTS niche is genuinely underserved (competitor analysis)."
    H2: "Radical mechanic reduction (~3 units, 1 resource, no fog of war) suffices for a satisfying match arc (UX research)."
    H3: "Deterministic fixed-timestep sim + seeded RNG + command log is achievable in Phaser 4 without fixed-point math (tech research)."
    H4: "Time-to-first-meaningful-action (<30s) and match-completion rate predict success better than strategic depth (metrics research)."

research_dimensions:
  competitors: completed
  ux_patterns: completed
  codebase: completed
  tech_stack: completed
  metrics_roi: completed
