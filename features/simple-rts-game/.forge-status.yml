  - phase: revalidation
    decision: approved
    at: "2026-08-21T10:35:38Z"
    reviewed_sha: "93ec5861bf45d7e317936582ef72f8dca58d67f1"
    risk: low
    revisions: 1
    notes: "Spec LOCKED after 1 revision. A determinism lens was applied to all 10 Must-Have acceptance criteria BEFORE the gate rather than at approval, asking of each: would two competent implementers build materially different things? Five would. All five resolved plus two minor ones. Final consistency pass clean: 16/16 cross-links, 3/3 wireframes, 12/12 Must+Should stories journey-covered, traceability edge counts matching."
    findings_resolved:
      - "D-1 HIGH — US-003 nearest ore node had no distance metric and no tie-break. Now least squared Euclidean distance, ties by ascending node id (FR-027). Third instance of the unspecified-ordering defect class in this feature, after FR-021 targeting and FR-022 A*."
      - "D-2 HIGH — spec said the build bar has exactly four entries; the wireframe drew five. Resolved IN FAVOUR OF THE WIREFRAME (4 unit + 1 visually separated structure), because the drawing was the better design."
      - "D-3 MED — US-001 and metrics K2 shared a 30s threshold while measuring different quantities, so one was guaranteed to be measured wrong. Split into <=10s time-to-interactive (guarantee) and <30s observed first action (playtest measure)."
      - "D-4 MED — simultaneous Base destruction was an unspecified branch. Now an explicit Draw verdict (FR-028, EDGE-009) rather than an invisible arbitrary tie-break."
      - "D-5 MED — difficulty is a field of initial simulation state alongside the RNG seed and appears in the replay header, not encoded into the seed integer (FR-029)."
      - "MINOR — selection tests unit collision circles, not sprite bounds (FR-030), so art changes cannot change gameplay."
      - "MINOR — valid placement defined: full 64px footprint passable, in bounds, unoccupied (FR-031)."
    open_items:
      - "5 open questions knowingly carried forward: unit balance numbers (tuning pass), map layout and ore-node placement (plan), final sprite ids (implementation), project name vs art direction (user, cosmetic), audio scope (plan). None block the bridge."
      - "Expect a fourth unspecified-ordering instance during planning — it is this codebase characteristic defect class."
  - phase: bridge
    decision: approved
    at: "2026-08-21T10:43:28Z"
    reviewed_sha: "93ec5861bf45d7e317936582ef72f8dca58d67f1"
