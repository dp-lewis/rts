      - {version: 9, milestone: "M8", reason: "The balance tuning pass: base hp 1500->10500, build times +~70%, ore/node 1500->3400, and a sharper CR-001 ramp. Median match 1.6 -> 6.2 min, p90 2.0 -> 9.97. Every recorded hash in both existing cases moved, which is the expected size for a change to hp, build times AND the economy — unlike M6, which touched one case because 001 never fires a shot. Case 003 added in the same bump."}
      - {version: 8, milestone: "M6", reason: "The `place` command (FR-012 / REV-007) joins the hashed command set, and REV-006's cooldown off-by-one changes combat timing. Deliberate regen: 001-baseline's hashes did not move at all (no shot is fired in that case) and 002-ai-vs-ai's matched the regression's `got` column exactly — one case, one checkpoint, the blast radius expected of a combat-timing change."}
      - {version: 1, milestone: "M1", reason: "initial simulation behaviour"}
