      - "R2 CARRIED FORWARD — the real competitor is 'play nothing' at zero cost. Product spec must treat time-to-comprehension (<60s to legible play, <30s to first meaningful action) as a primary requirement, not a polish item."
      - "R3 CARRIED FORWARD — 'simple' must be pinned to a hard written v1 budget (unit count, resource count, mechanic list) with explicit non-goals, before Phase 5 Plan."
      - "R4 CARRIED FORWARD — plan must protect a playtest-and-tune loop; 'fun' is not verifiable by the traceability chain and will otherwise be dropped in favour of machine-checkable criteria."
  - phase: research
    decision: approved_with_conditions
    at: "2026-08-21T10:08:47Z"
    reviewed_sha: "2ac8aa052237fa0befb28de08a33e3ae39a2d84e"
    risk: low
    notes: "5/5 dimensions run (tech-stack + metrics opted in over config defaults to test H3/H4). All four hypotheses survived; H1 reframed (white space is session length, not genre), H4 split into sound-principle / unverifiable-measurement. 8 red flags raised."
    conditions:
      - "RF-1 RESOLVED — constitution amended to v1.1.0 (MINOR). Principle I now enumerates the supported-platform set: Node LTS on ubuntu-latest + macos-latest (headless) plus Chromium via Playwright; and states the deterministic/non-deterministic arithmetic boundary explicitly, forbidding transcendentals in sim code. Propagated to plan-template.md and tasks-template.md in the same change per the amendment procedure."
      - "RF-2 OPEN — A* open-set tie-breaking must use a stable rule (entity id) and carry a dedicated determinism test. Highest-probability determinism defect in the project."
      - "RF-3 OPEN — Phaser update(time, delta) idiom is unusable for sim per Principle I; mitigate by lint + explicit plan note, not vigilance."
      - "RF-4 OPEN — the 'fun' goal has a single manual check (comprehension playtest); it needs a protected slot in the plan or machine-checkable criteria will crowd it out."
      - "RF-5 OPEN — single-player-only forgoes the retention mechanism every competitor leads with; recorded as a knowing v1 trade-off, not an oversight."
      - "RF-6 OPEN — WebGL-unsupported is newly reachable (Phaser 4 deprecated Canvas); needs an honest fallback state."
      - "RF-7 OPEN — nothing instrumented (telemetry.* = none) and mobile benchmarks do not transfer; measure against ourselves via local counters + playtest."
      - "RF-8 OPEN — Kenney sprites appear to bake team colour in; ownership conveyed by colour alone violates WCAG 1.4.1. Non-colour differentiator required as an explicit spec requirement."
      - "ASSETS — Kenney 'RTS Pack: Sci-Fi' (CC0) added to repo at images/ mid-session: 48 unit / 16 structure / 42 tile / 20 environment sprites, uniform 64x64 (128x128 Retina). Settles art direction; supplies a natural 64px grid module for deterministic grid A*. Recorded in research/assets.md."
