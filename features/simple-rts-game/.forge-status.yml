    obligations_discharged:
      - "OBLIGATION 1 - canonical state hash defined in ADR-001: fixed field order, id-ordered traversal, exact IEEE-754 bits via DataView. Rounding before hashing explicitly REJECTED (it would hide the sub-ulp divergence Principle I exists to detect). FNV-1a two 32-bit lanes to 64-bit hex, vendored, no dependency."
