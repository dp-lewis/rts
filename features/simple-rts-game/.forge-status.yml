      m6_note: "T052 is the only Test-first: true task in M6 and the first since M4, so the gate was genuinely load-bearing here rather than voluntary. `selectInRect` stubbed to throw gave 12 failed | 1 passed of 13 collected; green at 15/15 after T053. The single Red-state pass asserts the function's arity, structural and green in both states."
      m5_note: "Rejected a THIRD time for the M1 reason, and this time the test was already written when the run started. tests/game/loop.test.ts failed with 'Cannot find module ../../src/game/loop' and ZERO tests collected — a failure an empty file turns green. A signature-only src/game/loop.ts (every export present, advanceAccumulator throwing) moved it to 17 failed | 1 passed of 18 collected; green after T048 at 18/18. The single Red-state pass reads only the two constants and is green by design in both states, the same scoping control M0 used. Worth recording that M5 carries NO Test-first: true task in tasks.md — all 27 markers sit in M0-M4 and M6 — so the loop test was a voluntary extension of the discipline, and it immediately caught a defect the milestone would otherwise have shipped."
      evidence: "5 failed | 1 passed. Each failure read 'X was planted in src/sim/... and ESLint reported no error. Rules that did fire: (none)'. Green after T004: 6 passed (6). The one pass in the Red state is the scoping control, green by design in both states."
      m1_note: "Red rejected a SECOND time for the same reason: running the eight new test files against a repo with no src/sim modules produced bare 'Cannot find module' errors with zero new tests collected. Signature-only stubs (every export present, every body throwing) moved the failure to 43 collected tests failing on real calls. Writing the stubs also forced the whole M1 API surface to be settled before any logic existed. Green after T015-T025: 86 passed."
      note: "The first Red draft was REJECTED as insufficient — it failed with 'ESLint returned no result' (no config file, so ESLint matched nothing), which would have gone green on an empty eslint.config.js. Rewritten to lint against a parser-only rule-free fallback so a rule-less config still fails."
